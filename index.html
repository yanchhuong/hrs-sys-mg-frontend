
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      <!-- SEO — primary tags for Google, Bing, Yandex. Title +
           description are what actually render in the search
           results, so keep the pitch tight and Cambodia-first. -->
      <title>Smart-HRMS — HR, Payroll, POS &amp; Accounting for Cambodia (Khmer / English)</title>
      <meta name="description" content="Smart-HRMS is a bilingual (Khmer &amp; English) all-in-one platform for Cambodian businesses: HR Management, Payroll with Tax on Salary + NSSF, POS with KHQR + PayWay, Accounting (Invoice / Bill / Expense), Attendance with fingerprint devices, and OT Management. One database, one permission matrix, one login." />
      <meta name="keywords" content="POS Khmer, POS Cambodia, HR management Cambodia, HRMS Cambodia, Payroll Cambodia, Tax on Salary Cambodia, NSSF Cambodia, Accounting Cambodia, Invoice, Bill, Expense, Attendance management, Fingerprint attendance, OT management, Overtime Cambodia, Khmer HR system, Smart-HRMS, ERP Cambodia, KHQR, PayWay ABA" />
      <meta name="author" content="Smart-HRMS" />
      <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
      <meta name="googlebot" content="index, follow" />
      <meta name="theme-color" content="#2563eb" />

      <!-- Language + regional targeting. Duplicate hreflang so
           Google's crawler picks the right variant per user. -->
      <link rel="alternate" hreflang="en" href="https://smart-hrms.com/" />
      <link rel="alternate" hreflang="km" href="https://smart-hrms.com/km" />
      <link rel="alternate" hreflang="zh" href="https://smart-hrms.com/zh" />
      <link rel="alternate" hreflang="x-default" href="https://smart-hrms.com/" />
      <link rel="canonical" href="https://smart-hrms.com/" />

      <!-- Open Graph — Facebook, LinkedIn, Slack unfurl previews. -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Smart-HRMS" />
      <meta property="og:title" content="Smart-HRMS — HR, Payroll, POS &amp; Accounting for Cambodia" />
      <meta property="og:description" content="Bilingual (Khmer / English) HR &amp; Payroll platform built for Cambodian businesses. POS, Accounting, Attendance, OT Management — one platform, one database." />
      <meta property="og:url" content="https://smart-hrms.com/" />
      <meta property="og:locale" content="en_US" />
      <meta property="og:locale:alternate" content="km_KH" />
      <meta property="og:locale:alternate" content="zh_CN" />
      <meta property="og:image" content="https://smart-hrms.com/og-cover.png" />

      <!-- Twitter Card — same message, Twitter/X-shape preview. -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Smart-HRMS — HR, Payroll, POS &amp; Accounting for Cambodia" />
      <meta name="twitter:description" content="Bilingual (Khmer / English) HR &amp; Payroll platform for Cambodian businesses. POS, Accounting, Attendance, OT Management — one platform." />
      <meta name="twitter:image" content="https://smart-hrms.com/og-cover.png" />

      <!-- JSON-LD structured data — Google renders this as the
           SoftwareApplication rich result: name, category,
           operating system, offers, aggregate rating. -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Smart-HRMS",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "HR Management, Payroll, POS, Accounting, Attendance, Overtime Management",
        "operatingSystem": "Web",
        "inLanguage": ["en", "km", "zh"],
        "areaServed": "KH",
        "description": "Bilingual (Khmer & English) HR & Payroll platform for Cambodian businesses. Includes POS (with KHQR + PayWay), Accounting (Invoice / Bill / Expense), Attendance with fingerprint devices, and OT Management. One database, one permission matrix, one login.",
        "url": "https://smart-hrms.com/",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "USD",
          "price": "0",
          "availability": "https://schema.org/InStock"
        },
        "featureList": [
          "HR Management",
          "Payroll (Cambodia Tax on Salary + NSSF)",
          "POS (Point of Sale) with KHQR + PayWay",
          "Accounting (Invoice / Bill / Expense)",
          "Attendance with fingerprint devices",
          "Overtime (OT) Management",
          "Khmer / English bilingual UI"
        ]
      }
      </script>
      <!-- Khmer fonts: Moul (display) for titles, Battambang for body.
           Noto Sans Khmer is a wide-coverage fallback for any missing glyphs. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700&family=Moul&family=Noto+Sans+Khmer:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      />
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        /* Landing-page style refresh: Hanken Grotesk for display /
           marketing headings, Inter for body copy. Scoped to the
           opt-in .landing-typography wrapper so the in-app UI
           (which uses its own tokens) isn't affected. */
        .landing-typography { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        .landing-typography h1,
        .landing-typography h2,
        .landing-typography h3,
        .landing-typography h4 {
          font-family: 'Hanken Grotesk', 'Inter', system-ui, sans-serif;
          letter-spacing: -0.01em;
        }
        /* Khmer override — I18nContext toggles html.lang-km when the
           active language is Khmer. Body copy switches to Battambang
           at weight 300 (Light) for an airier read; headings switch
           to Moul, the traditional Khmer display face, at its native
           weight. Latin characters that appear inside a Khmer string
           fall through to Hanken Grotesk / Inter so the mixed lines
           still render cleanly. */
        html.lang-km .landing-typography,
        html.lang-km .landing-typography p,
        html.lang-km .landing-typography li,
        html.lang-km .landing-typography span,
        html.lang-km .landing-typography a,
        html.lang-km .landing-typography button {
          font-family: 'Battambang', 'Inter', system-ui, sans-serif;
          font-weight: 300;
        }
        html.lang-km .landing-typography h1,
        html.lang-km .landing-typography h2,
        html.lang-km .landing-typography h3,
        html.lang-km .landing-typography h4 {
          font-family: 'Moul', 'Battambang', 'Hanken Grotesk', 'Inter', system-ui, sans-serif;
          font-weight: 400;
          letter-spacing: 0;
        }
        /* Battambang x-height sits noticeably lower than Latin fonts —
           +20% overshot the parity target and made every panel feel
           cramped, so we hold the global root bump at +10%. The
           sidebar keeps its own additional emphasis below (bold +
           small size boost) since that surface needs the most
           legibility help. */
        html.lang-km { font-size: 110%; }
        /* Sidebar labels get an additional emphasis when the app is
           in Khmer — bolder weight + a small size boost — because
           Battambang's default weight can wash out at the sidebar's
           compact type sizes. Scoped to the <aside> so main content
           keeps its normal rhythm. */
        html.lang-km aside,
        html.lang-km aside a,
        html.lang-km aside span,
        html.lang-km aside button {
          font-weight: 600;
          font-size: 1.05em;
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
