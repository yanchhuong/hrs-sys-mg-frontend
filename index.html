
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Device routing: SIGNED-IN phones go to the mobile site,
           m.hr-share.com. Only this site checks the device — the mobile
           site never redirects anyone, so opening it directly always
           stays there.

           v-ai-visibility (2026-11-28) — anonymous phones are no longer
           redirected: they read the landing page here, and its Sign in
           button opens the mobile app (src/app/utils/mobileSite.ts).
           Google indexes with its phone crawler first; sending every
           phone to the sign-in app meant Google only ever saw a login
           screen. A crawler never has a session, so it stays — exactly
           like any signed-out person. Still no bot exception.

           v-mobile-site-own-domain — back on m.hr-share.com (2026-11-20).
           For a while phones went to smrt-hrms-view.vercel.app instead,
           because Smart (the carrier) was restricting m.hr-share.com; that
           is stable again. Both names serve the same deployment, but only
           m.hr-share.com is on the Firebase key's allowed sites, so web
           push works there and fails (403) on the Vercel name. If Smart
           blocks it again, smrt-hrms-view.vercel.app is the fallback.
           MOBILE_SITE is written here and in src/app/utils/mobileSite.ts
           (this script runs before the bundle, so it can't import it).

           Runs in the browser, first thing in <head>, so a phone leaves
           before the desktop bundle downloads (no flash, no wasted mobile
           data). It replaces the Vercel edge rule switched off in 84e7f15:
           that rule skipped bots and crawlers, so scanners saw a different
           site than phones — the "cloaking" pattern behind Smart's phishing
           block. Here the server sends every visitor the same page and the
           same rule runs for all of them; there is no bot exception.

           Only on the production host — localhost, Vercel previews and the
           Capacitor / Tauri builds (https://localhost) never redirect.
           Public pages customers open from a phone stay on this site: the
           mobile app has no /scan, /pos/display, /shop, /kitchen,
           /requirement-survey, /cambodia, /reset-password, /invoice/view,
           /rsvp (personal invitation) or /invite (shared invitation).

           ?desktop=1 keeps a phone here and is remembered in the
           prefer_desktop cookie (this host only); ?desktop=0 clears it. -->
      <!-- CSP: vercel.json allows this script by its sha256 hash. Change a
           character inside it and the hash there must be updated too. -->
      <script>
        (function () {
          var MOBILE_SITE = 'https://m.hr-share.com/';
          try {
            if (!/^(www\.)?hr-share\.com$/.test(location.hostname)) return;
            var choice = /[?&]desktop=([01])(&|$)/.exec(location.search);
            if (choice && choice[1] === '1') {
              document.cookie = 'prefer_desktop=1; path=/; max-age=31536000; SameSite=Lax';
              return;
            }
            if (choice) document.cookie = 'prefer_desktop=; path=/; max-age=0; SameSite=Lax';
            else if (/(^|;\s*)prefer_desktop=1/.test(document.cookie)) return;
            if (!/iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|BB10|Opera Mini|IEMobile/i.test(navigator.userAgent || '')) return;
            // Public pages (no sign-in) are never sent to the mobile app —
            // it has none of them. Add every new public route here.
            if (/^\/(scan|pos\/display|requirement-survey|cambodia|reset-password)(\/|$)|^\/(shop|kitchen|invoice\/view|rsvp|invite)\//.test(location.pathname)) return;
            // Signed out (people and crawlers alike) → stay on the landing page.
            if (!localStorage.getItem('hrms:apiToken')) return;
            location.replace(MOBILE_SITE);
          } catch (e) { /* never keep anyone off the site */ }
        })();
      </script>
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: installable shell. The service worker is the existing
         /firebase-messaging-sw.js (root scope) — deliberately NOT a
         second worker, which would displace it and break push. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#005EB8" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HR-Share" />

      <!-- SEO — primary tags for Google, Bing, Yandex. Title +
           description are what actually render in the search
           results, so keep the pitch tight and Cambodia-first. -->
      <!-- Brand (owner's decision, 2026-11-28): product "Smart HRMS"
           first, company "HR-Share 360°" second. Use the same names in
           og:*, twitter:*, the JSON-LD and the landing footer. -->
      <title>Smart HRMS — HR, Payroll, POS &amp; Accounting for Cambodia | HR-Share 360°</title>
      <meta name="description" content="Smart HRMS by HR-Share 360° — Khmer &amp; English HR management, payroll with Tax on Salary + NSSF, attendance with fingerprint devices, OT, POS with KHQR + PayWay, and accounting (invoice, bill, expense) for Cambodian businesses." />
      <meta name="keywords" content="POS Khmer, POS Cambodia, HR management Cambodia, HRMS Cambodia, Payroll Cambodia, Tax on Salary Cambodia, NSSF Cambodia, Accounting Cambodia, Invoice, Bill, Expense, Attendance management, Fingerprint attendance, OT management, Overtime Cambodia, Khmer HR system, Smart HRMS, HR-Share 360, ERP Cambodia, KHQR, PayWay ABA" />
      <meta name="author" content="HR-Share 360°" />
      <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
      <meta name="googlebot" content="index, follow" />
      <meta name="theme-color" content="#2563eb" />

      <!-- Canonical host is www.hr-share.com — every absolute URL in
           these tags, the JSON-LD, robots.txt and sitemap.xml must use
           it. No hreflang until /km really serves Khmer from the URL —
           today the language comes from the visitor's saved choice, so
           a /km link would be a false promise. -->
      <link rel="canonical" href="https://www.hr-share.com/" />

      <!-- Open Graph — Facebook, LinkedIn, Slack unfurl previews. -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="HR-Share 360°" />
      <meta property="og:title" content="Smart HRMS — HR, Payroll, POS &amp; Accounting for Cambodia" />
      <meta property="og:description" content="Khmer &amp; English HR and payroll platform built for Cambodian businesses. POS, accounting, attendance and OT management in one system." />
      <meta property="og:url" content="https://www.hr-share.com/" />
      <meta property="og:locale" content="en_US" />
      <meta property="og:locale:alternate" content="km_KH" />
      <!-- No og:image / twitter:image yet: og-cover.png never existed on
           this site. Add a 1200x630 cover (fictional demo data only) at
           /og-cover.png, then point both tags at
           https://www.hr-share.com/og-cover.png and set the card back to
           summary_large_image. -->

      <!-- Twitter Card — same message, Twitter/X-shape preview. -->
      <meta name="twitter:card" content="summary" />
      <meta name="twitter:title" content="Smart HRMS — HR, Payroll, POS &amp; Accounting for Cambodia" />
      <meta name="twitter:description" content="Khmer &amp; English HR and payroll platform for Cambodian businesses. POS, accounting, attendance and OT management in one system." />

      <!-- JSON-LD structured data — who we are (Organization), the site

           only: no ratings, prices, customer counts or awards. The
           contact is the official public one (owner, 2026-11-28) — keep
           it the same as the landing footer. -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.hr-share.com/#organization",
            "name": "HR-Share 360°",
            "url": "https://www.hr-share.com/",
            "logo": "https://www.hr-share.com/icons/icon-512.png",
            "description": "Business management software and digital solutions built for Cambodian businesses, from SMEs to large organizations.",
            "areaServed": { "@type": "Country", "name": "Cambodia" },
            "sameAs": ["https://t.me/smrthrms"],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+855-17-201-410",
              "contactType": "sales",
              "areaServed": "KH",
              "availableLanguage": ["km", "en"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.hr-share.com/#website",
            "name": "Smart HRMS — HR-Share 360°",
            "url": "https://www.hr-share.com/",
            "inLanguage": ["km", "en"],
            "publisher": { "@id": "https://www.hr-share.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Smart HRMS",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "HR Management, Payroll, POS, Accounting, Attendance, Overtime Management",
            "operatingSystem": "Web",
            "inLanguage": ["km", "en"],
            "areaServed": "KH",
            "description": "Khmer & English HR and payroll platform for Cambodian businesses. Includes POS (with KHQR + PayWay), accounting (invoice / bill / expense), attendance with fingerprint devices, and OT management.",
            "url": "https://www.hr-share.com/",
            "publisher": { "@id": "https://www.hr-share.com/#organization" },
            "featureList": [
              "HR Management",
              "Payroll (Cambodia Tax on Salary + NSSF)",
              "POS (Point of Sale) with KHQR + PayWay",
              "Accounting (Invoice / Bill / Expense)",
              "Attendance with fingerprint devices",
              "Overtime (OT) Management",
              "Khmer / English bilingual UI"
            ]
          }
        ]
      }
      </script>
      <!-- Khmer fonts: Moul (display) for titles, Battambang for body.
           Noto Sans Khmer is a wide-coverage fallback for any missing glyphs. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700&family=Moul&family=Noto+Sans+Khmer:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      />
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        /* iOS bounces the DOCUMENT, so a drag on an iPad lifts the whole
           app and shows whatever paints <html> underneath it — which,
           with no background set, is the theme colour: a slab of brand
           blue below the chrome. The same thing was reported on the
           phone build. overscroll-behavior stops the bounce (Safari 16+)
           and the background colour makes the gutter the app's own grey
           on anything older. Deliberately NOT overflow: hidden — the
           shell scrolls inside <main>, but the public landing and shop
           pages scroll the document and must keep doing so. */
        html, body { overscroll-behavior: none; }
        html { background-color: #f9fafb; }
        /* Landing-page style refresh: Hanken Grotesk for display /
           marketing headings, Inter for body copy. Scoped to the
           opt-in .landing-typography wrapper so the in-app UI
           (which uses its own tokens) isn't affected. */
        .landing-typography { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        .landing-typography h1,
        .landing-typography h2,
        .landing-typography h3,
        .landing-typography h4 {
          font-family: 'Hanken Grotesk', 'Inter', system-ui, sans-serif;
          letter-spacing: -0.01em;
        }
        /* Khmer override — I18nContext toggles html.lang-km when the
           active language is Khmer. Body copy switches to Battambang
           at weight 300 (Light) for an airier read; headings switch
           to Moul, the traditional Khmer display face, at its native
           weight. Latin characters that appear inside a Khmer string
           fall through to Hanken Grotesk / Inter so the mixed lines
           still render cleanly. */
        html.lang-km .landing-typography,
        html.lang-km .landing-typography p,
        html.lang-km .landing-typography li,
        html.lang-km .landing-typography span,
        html.lang-km .landing-typography a,
        html.lang-km .landing-typography button {
          font-family: 'Battambang', 'Inter', system-ui, sans-serif;
          font-weight: 300;
        }
        html.lang-km .landing-typography h1,
        html.lang-km .landing-typography h2,
        html.lang-km .landing-typography h3,
        html.lang-km .landing-typography h4 {
          font-family: 'Moul', 'Battambang', 'Hanken Grotesk', 'Inter', system-ui, sans-serif;
          font-weight: 400;
          letter-spacing: 0;
        }
        /* Battambang x-height sits noticeably lower than Latin fonts —
           +20% overshot the parity target and made every panel feel
           cramped, so we hold the global root bump at +10%. The
           sidebar keeps its own additional emphasis below (bold +
           small size boost) since that surface needs the most
           legibility help. */
        html.lang-km { font-size: 110%; }
        /* Sidebar labels get an additional emphasis when the app is
           in Khmer — bolder weight + a small size boost — because
           Battambang's default weight can wash out at the sidebar's
           compact type sizes. Scoped to the <aside> so main content
           keeps its normal rhythm. */
        html.lang-km aside,
        html.lang-km aside a,
        html.lang-km aside span,
        html.lang-km aside button {
          font-weight: 600;
          font-size: 1.05em;
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
