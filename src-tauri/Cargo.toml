[package]
name = "smrt-hrms"
version = "0.1.0"
description = "SMRT HRMS — Windows desktop shell over the cloud-hosted API."
authors = ["Kosign"]
edition = "2021"
rust-version = "1.75"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "smrt_hrms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# V-fcm-3-tauri — native Windows notifications for the desktop app.
# WebView2's Web-Push support is unreliable so the FE bridges every
# FCM foreground message + polled notification through this plugin
# to raise a real Action-Center toast on Windows.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
