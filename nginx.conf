# SPA serving + API reverse-proxy.
#
# • / → static files from /usr/share/nginx/html, falling back to index.html
#   so client-side routes (e.g. /attendance, /reports) survive a hard refresh.
# • /api/ → proxied to the `api` service on the docker network. The browser
#   sees same-origin requests, so CORS is a non-issue and the JWT cookie
#   path stays consistent across page + xhr.
server {
    listen 80;
    server_name _;

    # Static-asset root + default file. Required because we replaced the
    # image's built-in default.conf — without these the SPA returns 404
    # on every path even though the files are at /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults for SPAs
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets, short cache for index.html so a deploy
    # is picked up promptly.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API proxy — `api` resolves to the Spring Boot container.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts for slow uploads / report generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # SPA fallback — every non-asset, non-/api request returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
