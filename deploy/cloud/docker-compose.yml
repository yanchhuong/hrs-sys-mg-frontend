# HRMS — cloud deployment
#
# Services:
#   caddy     — TLS terminator + reverse proxy (auto HTTPS via Let's Encrypt)
#   frontend  — nginx serving the Vite build
#   backend   — Spring Boot API (built from ../../../HRM System API)
#   db        — Postgres 16
#
# Start:   docker compose --env-file ./.env up -d --build
# Logs:    docker compose logs -f backend

name: hrms-cloud

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../../HRM System API
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      DEPLOYMENT_MODE: cloud
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hrms}
      DATABASE_USER: ${POSTGRES_USER:-hrms}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      # AI-Agent reachability. The agent runs in its own compose
      # project (AI-Agent/docker-compose.yml) on a separate docker
      # network on the same droplet, so we can't address it by service
      # name from here — instead reach the host gateway and the
      # agent's published host port (default 5174). Empty/unset =
      # TelegramNotifier returns SendResult.disabled() and the
      # operator sees "Telegram delivery is not configured on this
      # server." TELEGRAM_AGENT_SECRET must match the same env var on
      # the AI-Agent side or the agent rejects with 403.
      TELEGRAM_AGENT_BASE_URL: ${TELEGRAM_AGENT_BASE_URL:-http://host.docker.internal:5174}
      TELEGRAM_AGENT_SECRET: ${TELEGRAM_AGENT_SECRET:-}
    # Make host.docker.internal resolve on Linux droplets — Docker
    # Desktop on Mac/Windows ships this hostname for free; on Linux
    # we have to add it explicitly via the magic host-gateway value.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4000"

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env for TLS cert registration}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
  caddy-data:
  caddy-config:
